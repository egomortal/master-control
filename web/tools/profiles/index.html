<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>Master Control · Your controller profiles</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="component.css"></head><body><a class="skip" href="#content">Skip to content</a><main id="content"><p class="eyebrow">MASTER CONTROL</p><h1>Your controller profiles</h1><p>Save a layout, then review it before applying.</p><div class="grid"><section class="tile"><h2>Edit a profile</h2><label>Name<input id="name" maxlength="40" value="Comfort"></label><details><summary>Controller and app binding</summary><label>Controller model code<input id="device" placeholder="VVVV_PPPP" maxlength="9"></label><label>App binding (optional)<input id="app" maxlength="32" placeholder="Installed app ID"></label></details><label>Button<select id="source"><option>cross</option><option>circle</option><option>p1</option><option>l1</option></select></label><label>Send as<select id="target"><option>cross</option><option>r1</option><option>circle</option><option>none</option></select></label><button id="save" class="primary">Save profile</button></section><section class="tile"><h2>Saved layouts</h2><label>Profile<select id="profiles"></select></label><div class="row"><button id="apply">Apply selected</button><button id="share">Show sharing file</button></div><p id="result"></p><details><summary>Sharing and import</summary><label>Profile JSON<textarea id="json" maxlength="12000"></textarea></label><button id="import">Import reviewed profile</button></details></section></div><p id="status" role="status" aria-live="polite"></p></main><footer class="hint">D-pad · Move × · Select ○ · Back</footer><s
